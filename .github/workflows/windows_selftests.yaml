name: Build and Run on Windows

on:
  push:
    # Release candidates are validated on "release" and master is then fast-forwarded to that
    # exact commit, so re-running here would test an identical SHA -- and a flaky test could
    # turn an already-validated tagged commit red. Pull requests still run against master.
    branches: [ "release" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:

  run_samples_pc:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Headers, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Bash script
        shell: bash
        run: |
          cd utilities
          if ! ./run_tests.sh --visbuildonly --log-file ../windows_selftests.log; then
            echo "==== run_tests.sh failed; dumping windows_selftests.log ===="
            cat ../windows_selftests.log
            exit 1
          fi
