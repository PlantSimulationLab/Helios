name: Build and Run on Linux EC2 GPU Instance

on:
  push:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  id-token: write
  contents: read

jobs:

  start-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-west-2
      - run: |
          # Wait for instance to be in a state where it can be started (max 5 minutes)
          echo "Waiting for instance to be in a startable state..."
          timeout 300 bash -c '
            while true; do
              STATE=$(aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }} --query "Reservations[0].Instances[0].State.Name" --output text)
              echo "Current instance state: $STATE"
              if [[ "$STATE" == "stopped" || "$STATE" == "running" ]]; then
                echo "Instance is in a startable state: $STATE"
                break
              fi
              echo "Instance is in transitional state: $STATE. Waiting 10 seconds..."
              sleep 10
            done
          ' || {
            echo "Timeout waiting for instance to reach startable state"
            exit 1
          }
          
          # Only start if not already running
          CURRENT_STATE=$(aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }} --query "Reservations[0].Instances[0].State.Name" --output text)
          if [[ "$CURRENT_STATE" == "stopped" ]]; then
            echo "Starting instance..."
            aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }}
            aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }}
          elif [[ "$CURRENT_STATE" == "running" ]]; then
            echo "Instance is already running"
          else
            echo "Unexpected instance state: $CURRENT_STATE"
            exit 1
          fi

  run_samples_linux:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    # Pin the OS label so this job can ONLY land on the Linux runner. The `helios` label alone is
    # also carried by a Windows self-hosted runner (windows-helios); without `Linux` here, if the
    # Linux runner is offline GitHub will silently route this job to the Windows runner, where the
    # bash script below fails to parse under PowerShell.
    runs-on: [self-hosted, helios, Linux]
    needs: start-gpu
    steps:
      - uses: actions/checkout@v4

      # The entire purpose of this job is exercising GPU code paths. Every GPU test skips
      # gracefully when no device is found, so without this check a runner whose driver has
      # died reports a green build having tested nothing at all - which is exactly what
      # happened between v1.3.78 and v1.3.79. Runs before the ~20 minute build so a dead
      # driver is reported in seconds.
      - name: Verify GPU is present and usable
        shell: bash
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "ERROR: nvidia-smi not found on a runner dedicated to GPU testing."
            echo "The NVIDIA driver is not installed, or is not on PATH."
            exit 1
          fi
          if ! nvidia-smi; then
            echo "ERROR: nvidia-smi failed, so no usable NVIDIA device is present."
            echo "The CUDA toolkit can still compile in this state, which is why the build"
            echo "would otherwise succeed and every GPU test would silently skip."
            echo "Most often the kernel module did not rebuild after an OS or kernel update."
            exit 1
          fi

      - name: Bash script
        shell: bash
        run: |
          cd utilities
          # --requiregpu turns a would-be GPU test skip into a failure. nvidia-smi above proves
          # the driver is alive; this proves Helios can actually use it (OptiX/Vulkan can still
          # fail to initialize against a healthy driver).
          if ! ./run_tests.sh --visbuildonly --requiregpu --log-file linux_GPU_selftests.log; then
            echo "==== run_tests.sh failed; dumping linux_GPU_selftests.log ===="
            cat linux_GPU_selftests.log
            exit 1
          fi
  

  stop-gpu:
    needs: run_samples_linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-west-2
      - run: |
          aws ec2 stop-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }}
          aws ec2 wait instance-stopped --instance-ids ${{ secrets.EC2_INSTANCE_ID_LINUX }}
