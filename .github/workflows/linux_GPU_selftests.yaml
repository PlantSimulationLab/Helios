name: Build and Run on Linux GPU

on:
  push:
    # Runs on the release branch only. The release flow validates a candidate on "release",
    # then fast-forwards master to that exact commit, so a run on master would re-test an
    # identical SHA -- doubly wasteful here, where the runner is billed per minute.
    branches: [ "release" ]
  workflow_dispatch: {}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read

# Cancel a superseded run when "release" is re-pushed (e.g. a fix for a failure on another
# runner). Safe now that each run gets its own ephemeral GitHub-hosted machine; the old
# self-hosted setup had to serialize runs because they shared one EC2 instance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run_samples_linux:
    # GitHub-hosted GPU larger runner (Tesla T4, 4 vCPU), defined in the PlantSimulationLab org
    # settings with the "NVIDIA GPU-Optimized VMI" partner image. That image is an Azure
    # Marketplace image GitHub does not manage, so nothing beyond the NVIDIA driver may be
    # assumed to be installed -- every dependency is installed explicitly below.
    runs-on: linux-x64-gpu-githubhosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The driver is installed but its kernel modules are not loaded at boot, so nvidia-smi fails
      # with "couldn't communicate with the NVIDIA driver" until they are.
      # https://github.com/orgs/community/discussions/138813
      - name: Load NVIDIA kernel modules
        run: |
          set -euo pipefail
          sudo modprobe nvidia
          sudo modprobe nvidia_uvm

      # The entire purpose of this job is exercising GPU code paths. Every GPU test skips
      # gracefully when no device is found, so without this check a runner whose driver is
      # unusable reports a green build having tested nothing at all - which is exactly what
      # happened between v1.3.78 and v1.3.79. Runs before the build so it fails in seconds.
      - name: Verify GPU is present and usable
        run: |
          set -euo pipefail
          if ! nvidia-smi; then
            echo "ERROR: nvidia-smi failed, so no usable NVIDIA device is present."
            exit 1
          fi
          nvidia-smi -L | grep -q "GPU 0" || { echo "ERROR: nvidia-smi reports no GPU devices."; exit 1; }

      - name: Install dependent packages for visualizer and Vulkan
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential libx11-dev xorg-dev libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libvulkan-dev glslang-tools

      # The image has no CUDA toolkit. Installed from NVIDIA's apt repository rather than
      # Jimver/cuda-toolkit: on this image the Jimver runfile install exits part-way without an
      # error and leaves no nvcc. The radiation CMake errors out if the toolkit is newer than the
      # driver supports (590.48 -> CUDA 13.1 when this was written), so 12.6 leaves headroom.
      - name: Install CUDA toolkit
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cuda-keyring.deb" https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-6
          test -x /usr/local/cuda-12.6/bin/nvcc || { echo "ERROR: nvcc missing after install"; exit 1; }
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      # The radiation CMake uses find_package(CUDAToolkit QUIET) and builds Vulkan-only when it
      # fails, which --requiregpu does not catch (Vulkan still finds the GPU). Check loudly here,
      # in seconds, instead of discovering it from the OptiX assertion after the full build.
      - name: Check CMake can find CUDA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cudacheck"
          cd "$RUNNER_TEMP/cudacheck"
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.18)' \
            'project(cudacheck LANGUAGES CXX)' \
            'find_package(CUDAToolkit REQUIRED)' \
            'message(STATUS "CUDAToolkit ${CUDAToolkit_VERSION}: nvcc=${CUDAToolkit_NVCC_EXECUTABLE}")' \
            'include(CheckLanguage)' \
            'check_language(CUDA)' \
            'if(NOT CMAKE_CUDA_COMPILER)' \
            '  message(FATAL_ERROR "CUDAToolkit found but the CUDA language cannot be enabled")' \
            'endif()' > CMakeLists.txt
          cmake -S . -B build

      - name: Bash script
        run: |
          cd utilities
          # --requiregpu turns a would-be GPU test skip into a failure. nvidia-smi above proves
          # the driver is alive; this proves Helios can actually use it. --verbose puts the CMake
          # output in the log, which the OptiX assertion below reads.
          if ! ./run_tests.sh --visbuildonly --requiregpu --verbose --log-file ../linux_GPU_selftests.log; then
            echo "==== run_tests.sh failed; dumping linux_GPU_selftests.log ===="
            cat ../linux_GPU_selftests.log
            exit 1
          fi

      # --requiregpu passes on a Vulkan-only or legacy OptiX 6.5 build, neither of which tests the
      # OptiX 8 backend that users with current drivers run.
      - name: Assert the OptiX 8.1 backend was built
        if: always()
        run: |
          grep -E "\[Radiation\] (OptiX|Detected NVIDIA|Driver supports)|CUDA not found|falling back to Vulkan-only" linux_GPU_selftests.log || true
          grep -q "\[Radiation\] OptiX 8.1 backend enabled" linux_GPU_selftests.log \
            || { echo "ERROR: OptiX 8.1 backend was not enabled (Vulkan-only or legacy OptiX 6.5 build)."; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux_GPU_selftests_log
          path: linux_GPU_selftests.log
