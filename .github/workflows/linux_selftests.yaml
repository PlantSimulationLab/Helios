name: Build and Run on Linux

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:

  run_samples_linux:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before the build so an unguarded GPU test fails in seconds rather than after the
      # full ~15 minute build-and-test cycle. This is the single most common cause of a red
      # non-GPU runner: a test that only exercises CPU-side logic but constructs a
      # RadiationModel, which requires a ray tracing backend.
      - name: Lint for unguarded GPU test cases
        run: ./utilities/lint_gpu_tests.sh

      # Also runs before the build, and deliberately on the Linux runner rather than the Windows
      # one: the point is to fail here, in seconds and on the cheapest runner, instead of on
      # Windows ten minutes into a build. POSIX-only calls in test code compile fine on Linux and
      # macOS and break only MSVC, so without this check the first signal is a red Windows job
      # (v1.3.79 lost two Windows runs to setenv/unsetenv this way).
      - name: Lint test code for MSVC portability
        run: ./utilities/lint_test_portability.sh

      #- uses: openrndr/setup-opengl@v1.1
      - name: Checkout OPENRNDR repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: openrndr/openrndr
          path: ./openrndr
          ref: master

      - name: Test glxinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils xvfb
          xvfb-run glxinfo

      - name: Install dependent packages for visualizer and Vulkan
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libx11-dev xorg-dev libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libvulkan-dev glslang-tools

      - name: Bash script
        run: |
          cd utilities
          if ! ./run_tests.sh --visbuildonly --log-file ../linux_selftests.log; then
            echo "==== run_tests.sh failed; dumping linux_selftests.log ===="
            cat ../linux_selftests.log
            exit 1
          fi