name: Build and Run on MacOS

on:
  push:
    # Release candidates are validated on "release" and master is then fast-forwarded to that
    # exact commit, so re-running here would test an identical SHA -- and a flaky test could
    # turn an already-validated tagged commit red. Pull requests still run against master.
    branches: [ "release" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:

  run_samples_mac:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install homebrew
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      - name: Install XQuartz
        run: brew install Caskroom/cask/xquartz
      - name: Install OpenMP support
        run: brew install libomp
      - name: Install Vulkan dependencies
        run: brew install vulkan-headers vulkan-loader molten-vk glslang

      - name: Bash script
        run: |
          cd utilities
          if ! ./run_tests.sh --visbuildonly --log-file ../macos_selftests.log; then
            echo "==== run_tests.sh failed; dumping macos_selftests.log ===="
            cat ../macos_selftests.log
            exit 1
          fi